name: Reference integrity

on:
  push:
    branches:
      - main
      - "repo/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  structural:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/reference_audit.py --selftest
      - run: python scripts/reference_audit.py
      - run: python codex/build_codex.py --selftest
      - run: python -m unittest discover -s tests -p "test_*.py" -v
