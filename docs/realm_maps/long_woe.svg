<text x='40' y='76' font-size='13'>wilderness / Named realm of fever-meadows, twilit glades and painforests / attested Vol. III 9:xxi, Vol. III 10:xviii / band 2</text>
<text x='40' y='96' font-size='13' fill='#1d3d5c'>LAW (INFERRED, The Wood of Suicides; the garden that rots): The vegetation is sentient and suffering. Cut it and it speaks; sleep in it and the fever</text><text x='40' y='112' font-size='13' fill='#1d3d5c'>is yours. Steam rising means the realm is ending, and it ends downhill.</text>
<text x='40' y='130' font-size='12'>LAW ROLL 4: Four intervals.</text>
