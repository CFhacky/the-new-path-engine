<text x='40' y='76' font-size='13'>fortress / Warp fortress on the margins of the Planes of Excess, with its approaches / attested Vol. III 9:xxi, Vol. III 9:xxi, Vol. III 10:xviii / band 3</text>
<text x='40' y='96' font-size='13' fill='#1d3d5c'>LAW (INFERRED, The Welsh Marches and their lords; the night approach on the camp): A frontier keep. The approaches are the fight and the walls are</text><text x='40' y='112' font-size='13' fill='#1d3d5c'>not; dread on the approach is a rolled hazard, and the keep itself is mildew and quiet.</text>
<text x='40' y='130' font-size='12'>LAW ROLL 4: Dread band 4: a check per interval outside the walls.</text>
