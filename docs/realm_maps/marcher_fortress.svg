<text x='40' y='760' font-size='11'>Edges: solid intersection (thick) / dashed angle / dotted conjunction / dash-dot oblique / red splice / blue fine-dot recursion (loop = the area contains the realm). Box weight = hazard band; red box = hazard 4+.</text>
<text x='40' y='778' font-size='11'>Labels: facts SOURCE-VERIFIED (index); law INFERRED (myth key); every area, exit and hazard ROLLED. Archetype tables: APPROVED PREPARATION (realm_map.py), pending ratification; not source, not canon.</text>
<text x='40' y='796' font-size='11'>Ledger: d8 = 8  [area count (d8)] | d6 = 4  [law roll (the myth rule&#x27;s parameter)] | d3 = 3  [A1 area kind (first slot: rows [1, 2, 3])] | d6 = 2  [A1 hazard band] | d8 = 1  [A1 psychotecture contradiction] | d12 = 9  [A2 area kind] ...</text>
