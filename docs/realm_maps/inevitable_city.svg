<text x='40' y='76' font-size='13'>composite-city / Central city/labyrinth of the Chaos realm-complex / attested Vol. I 4:xviii, Vol. II 5:xii, Vol. II 6:xxxv, Vol. II 8:xvi, Vol. III 10:xii, Vol. III 10:xviii / band 3</text>
<text x='40' y='96' font-size='13' fill='#1d3d5c'>LAW (INFERRED, Dis; Babylon the Great; Pandemonium; all cities blended; the ineluctable): Every district is a stolen city. Go deeper and you go older.</text><text x='40' y='112' font-size='13' fill='#1d3d5c'>Two adjacent streets need not agree about which city they are in, and a wall that joins another realm is still a wall.</text>
<text x='40' y='130' font-size='12'>LAW ROLL 4: Stratum depth 4: pre-Imperial masonry; stairs at the wrong pitch.</text>
